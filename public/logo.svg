<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="bgGrad" cx="45%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#1e5096"/>
      <stop offset="100%" stop-color="#091c38"/>
    </radialGradient>
    <linearGradient id="shieldTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a6dd4"/>
      <stop offset="100%" stop-color="#0d2b52"/>
    </linearGradient>
    <linearGradient id="goldRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0d060"/>
      <stop offset="50%" stop-color="#c9a84c"/>
      <stop offset="100%" stop-color="#a07830"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shieldShadow">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Outer badge background -->
  <circle cx="100" cy="100" r="99" fill="#07152a"/>

  <!-- Outer gold ring -->
  <circle cx="100" cy="100" r="97" fill="none" stroke="url(#goldRing)" stroke-width="2.5"/>

  <!-- Main fill circle -->
  <circle cx="100" cy="100" r="93" fill="url(#bgGrad)"/>

  <!-- Inner subtle ring -->
  <circle cx="100" cy="100" r="84" fill="none" stroke="#c9a84c" stroke-width="0.6" stroke-opacity="0.5"/>

  <!-- Top decorative bar -->
  <rect x="34" y="36" width="132" height="1.5" fill="#c9a84c" opacity="0.5" rx="1"/>

  <!-- TOP label: MUNICIPAL SOCIAL WELFARE -->
  <text x="100" y="30" text-anchor="middle"
        font-family="'Arial Narrow',Arial,sans-serif" font-size="8.5"
        font-weight="bold" fill="#c9a84c" letter-spacing="1.2">
    MUNICIPAL SOCIAL WELFARE
  </text>

  <!-- TOP label line 2: & DEVELOPMENT OFFICE -->
  <text x="100" y="43" text-anchor="middle"
        font-family="'Arial Narrow',Arial,sans-serif" font-size="8.5"
        font-weight="bold" fill="#c9a84c" letter-spacing="1.2">
    &amp; DEVELOPMENT OFFICE
  </text>

  <!-- Shield body -->
  <path d="M100 58 L136 74 L136 108 Q136 136 100 150 Q64 136 64 108 L64 74 Z"
        fill="url(#shieldTop)" filter="url(#shieldShadow)"/>

  <!-- Shield inner bevel -->
  <path d="M100 63 L131 78 L131 108 Q131 133 100 145 Q69 133 69 108 L69 78 Z"
        fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>

  <!-- Heart symbol -->
  <path d="M100 122 C100 122 82 106 82 94 C82 86 87 82 92 84.5 C95 85.8 97.5 88.5 100 92 C102.5 88.5 105 85.8 108 84.5 C113 82 118 86 118 94 C118 106 100 122 100 122Z"
        fill="white" opacity="0.96" filter="url(#glow)"/>

  <!-- AICS acronym inside shield -->
  <text x="100" y="78" text-anchor="middle"
        font-family="'Arial Black',Arial,sans-serif" font-weight="900"
        font-size="10" fill="rgba(255,255,255,0.75)" letter-spacing="2">AICS</text>

  <!-- Bottom gold separator line -->
  <rect x="34" y="162" width="132" height="1.5" fill="#c9a84c" opacity="0.5" rx="1"/>

  <!-- MSWDO text -->
  <text x="100" y="175" text-anchor="middle"
        font-family="'Arial Narrow',Arial,sans-serif" font-weight="bold"
        font-size="14" fill="white" letter-spacing="3.5">MSWDO</text>

  <!-- LGU sub-label -->
  <text x="100" y="189" text-anchor="middle"
        font-family="'Arial Narrow',Arial,sans-serif"
        font-size="7.5" fill="#c9a84c" letter-spacing="0.8">LGU MARAMAG, BUKIDNON</text>

  <!-- Decorative corner dots -->
  <circle cx="52" cy="100" r="1.5" fill="#c9a84c" opacity="0.4"/>
  <circle cx="148" cy="100" r="1.5" fill="#c9a84c" opacity="0.4"/>
</svg>
